#tmux display things in 256 colors
set -g default-terminal "tmux-256color"
# Alt / Shift / Ctrl хосолсон товчнуудыг програм руу зөв дамжуулах (fzf, vim)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys:RGB'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# copy for web browser
# Clipboard-ын backend-ыг ~/.local/bin/tmux-clip өөрөө таана (pbcopy / wl-copy /
# xclip / xsel), тиймээс энэ config Mac, Wayland, X11, headless дээр адилхан.
set -g set-clipboard on
set -s copy-command '$HOME/.local/bin/tmux-clip copy'

set -g history-limit 20000

# automatically renumber tmux windows
set -g renumber-windows on

# Activity Monitoring
setw -g monitor-activity off
set -g visual-activity off

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# make delay shorter
set -sg escape-time 0

# tile all windows
unbind =
bind = select-layout tiled

# cycle through panes
# unbind C-a
# unbind o # this is the default key for cycling panes
# bind ^A select-pane -t:.+

# make window/pane index start with 1
set -g base-index 1
setw -g pane-base-index 1

# set-option -g set-titles on
# set-option -g set-titles-string "#T - #W"
# set-window-option -g automatic-rename on

######################
#### Key Bindings ####
######################

# reload config file
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# quickly open a new window
bind N new-window

# split window and fix path for tmux 1.9
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# synchronize all panes in a window
bind y setw synchronize-panes

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# enable mouse support for switching panes/windows
# NOTE: This breaks selecting/copying text on OSX
# To select text as expected, hold Option to disable it (iTerm2)
set -g mouse on

# for mouse scroll
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# maximizing and restoring windows
unbind Up
bind Up new-window -d -n fullscreen \; swap-pane -s fullscreen.1 \; select-window -t fullscreen
unbind Down
bind Down last-window \; swap-pane -s fullscreen.1 \; kill-window -t fullscreen

# set vi mode for copy mode
setw -g mode-keys vi
# more settings to make copy-mode more vim-like
# Аргументгүй copy-pipe-and-cancel нь дээрх `copy-command`-ыг ашиглана.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel

# Буфер ↔ системийн clipboard
bind -n C-s run -b 'tmux save-buffer - | $HOME/.local/bin/tmux-clip copy' \; display-message "Copied"
bind -n C-v run -b 'tmux set-buffer -- "$($HOME/.local/bin/tmux-clip paste)"; tmux paste-buffer' \; display-message "Pasted"

##############################
### Color & Style Settings ###
##############################

##############################
###        Plugins         ###
##############################
# ЭДГЭЭР нь файлын ХАМГИЙН ДООД талд байх ёстой: tpm нь plugin-уудаа ачаалахдаа
# дээрх тохиргоог уншсан байх шаардлагатай, мөн run '.../tpm' нь бүх @plugin
# мөрийн ДАРАА дуудагдана.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
# @resurrect-* / @continuum-* тохиргоо дээр байгаа тул plugin нь ЗААВАЛ хэрэгтэй.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'
