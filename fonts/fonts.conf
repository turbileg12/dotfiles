<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/.config/fontconfig/conf.d/50-turbileg.conf руу symlink болно (Linux дээр л).

  Асуудал: Hack Nerd Font-д CJK glyph байхгүй. Fontconfig нь дутуу ханзыг
  дүрмээр бол `Noto Sans Mono CJK KR`-ээс авдаг байсан — тэгэхээр Япон бичиг
  Солонгос хэлбэрийн ханзаар (直 画 骨 г.м. өөр зурлагатай) гарч байв.

  Шалгах:  fc-match -s 'monospace:lang=ja' | head -3
  Хүлээх:  Hack Nerd Font ... → Noto Sans Mono CJK JP (KR БИШ)
-->
<fontconfig>

  <!-- Ерөнхий monospace-ийн дараалал -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Hack-ийн гурван хувилбар бүрийн ард Япон CJK-г сул (weak) холбоно.
       Ингэснээр дутуу glyph нь ерөнхий эрэмбэ дэх KR-т хүрэхээс өмнө
       JP-ээр нөхөгдөнө. Бусад хэлний зан төлөвт нөлөөлөхгүй. -->
  <match target="pattern">
    <test name="family"><string>Hack Nerd Font</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hack Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hack Nerd Font Propo</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- lang=ja гэж шууд тэмдэглэгдсэн текстэд JP-г бусад CJK-аас өмнө тавина. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK JP</string>
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <!-- Терминалын текст үргэлж дүрсээ хадгалахын тулд hinting/antialias -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>rgb</const></edit>
  </match>

</fontconfig>
